  .hook{color:var(--dim);font-size:17px;line-height:1.4;margin:8px 0 26px}
  .appstore{display:inline-flex;align-items:center;gap:11px;background:#111;color:#fff;padding:11px 20px;border-radius:14px;box-shadow:0 8px 22px rgba(0,0,0,.18)}

  .appstore svg{width:25px;height:25px;fill:#fff;flex:none}
  .appstore .l{display:flex;flex-direction:column;line-height:1.05;text-align:left}
  .appstore .l small{font-size:10.5px;font-weight:500;letter-spacing:.01em;opacity:.92}
  .appstore .l b{font-size:18px;font-weight:600}
  .home{color:var(--dim);font-size:14px;margin-top:22px;padding:8px}
  /* The black badge on the dark page needs Apple's thin outline to keep its edge. */
  @media (prefers-color-scheme:dark){.appstore{box-shadow:0 0 0 1px rgba(255,255,255,.3)}}
